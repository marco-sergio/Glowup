html,body,#root{height:100%;overflow:hidden}
body{font-family:'Syne',sans-serif;background:#f4f1ec;color:#1a1814}

button{cursor:pointer;font-family:'Syne',sans-serif}
input,textarea,select{font-family:'Syne',sans-serif;outline:none}
.serif{font-family:'Playfair Display',serif}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes gloriaGlow{0%,100%{box-shadow:0 0 0 0 rgba(200,169,110,0)}50%{box-shadow:0 0 20px 4px rgba(200,169,110,0.25)}}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.slide-in{animation:slideIn 0.35s ease forwards}
.fade-in{animation:fadeIn 0.4s ease forwards}

.layout{display:grid;grid-template-columns:1fr var(--chat-w);grid-template-rows:52px 1fr;height:100vh;width:100vw}
.layout-header{grid-column:1/-1;grid-row:1}

.chip-suggest{padding:6px 14px;border-radius:99px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;transition:all .15s;white-space:nowrap;box-shadow:0 1px 3px rgba(26,24,20,0.06);}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:600}

function Marketplace({uiState,onBook,onView}){
  var _searchState=useState("");var search=_searchState[0];var setSearch=_searchState[1];
  var _tagsState=useState([]);var tags=_tagsState[0];var setTags=_tagsState[1];
  var _cityState=useState(null);var city=_cityState[0];var setCity=_cityState[1];
  var _dbDoctorsState=useState([]);var dbDoctors=_dbDoctorsState[0];var setDbDoctors=_dbDoctorsState[1];
  var _loadingDocsState=useState(true);var loadingDocs=_loadingDocsState[0];var setLoadingDocs=_loadingDocsState[1];

  // Carica medici dal DB
  useEffect(function(){
    var fetchDoctors=async function(){
      setLoadingDocs(true);
      // Query separata per profili e locations
      var dpRes=await sb.from("doctor_profiles")
        .select("*, profile:profiles!doctor_profiles_id_fkey(id,name,city)")
        .eq("available",true);
      var locRes=await sb.from("doctor_locations").select("*");
      var allLocations=(!locRes.error&&locRes.data)?locRes.data:[];

      if(!dpRes.error&&dpRes.data&&dpRes.data.length>0){
        var expanded=[];
        dpRes.data.forEach(function(d){
          var colors=["#c8a96e","#2dc889","#e06b4a","#5b8dee","#9b7fd4"];
          var name=d.profile?d.profile.name:"Medico";
          var ini=name.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase();
          var docLocs=allLocations.filter(function(l){return l.doctor_id===d.id;});
          var base={
            id:d.id,
            supabase_id:d.id,
            name:name,
            specialty:d.specialty||"Medicina Estetica",
            rating:4.8,
            reviews:0,
            price:d.price||100,
            initials:ini,
            services:d.services||[],
            bio:d.bio||"",
            available:d.available,
            tags:d.tags||[],
            accent:colors[name.length%colors.length],
            locations:docLocs,
          };
          // Raccogli tutte le città: profilo + sedi operative
          var mainCity=d.profile?d.profile.city:"";
          var allCities=mainCity?[mainCity]:[];
          docLocs.forEach(function(loc){
            if(loc.city&&!allCities.includes(loc.city)) allCities.push(loc.city);
          });
          if(allCities.length===0) allCities=["Italia"];
          // UNA sola card per medico con tutte le città
          expanded.push(Object.assign({},base,{
            city:allCities[0], // città principale per display
            allCities:allCities, // tutte le città per il filtro
            id:d.id,
            supabase_id:d.id,
          }));
        });
        setDbDoctors(expanded);
      }else{
        setDbDoctors(DOCTORS);
      }
      setLoadingDocs(false);
    };
    fetchDoctors();
  },[]);

  useEffect(function(){
    if(uiState.filterTags&&uiState.filterTags.length>0) setTags(uiState.filterTags);
    if(uiState.filterCity) setCity(uiState.filterCity);
  },[uiState.filterTags,uiState.filterCity]);

function MapView({locations}){
  var mapRef=useRef(null);
  var mapInstanceRef=useRef(null);

  useEffect(function(){
    if(!locations||locations.length===0) return;
    if(typeof L==="undefined") return;

    // Inizializza mappa solo una volta
    if(!mapInstanceRef.current){
      mapInstanceRef.current=L.map(mapRef.current,{zoomControl:true,scrollWheelZoom:false});
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        attribution:"© OpenStreetMap contributors",
        maxZoom:18,
      }).addTo(mapInstanceRef.current);
    }

    var map=mapInstanceRef.current;

    // Geocoding: converti indirizzi in coordinate tramite Nominatim
    var geocodeAndPin=async function(loc){
      var query=loc.address?loc.address+", "+loc.city:loc.city+", Italia";
      try{
        var res=await fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(query)+"&limit=1",{
          headers:{"Accept-Language":"it","User-Agent":"GlowUp-App"}
        });
        var data=await res.json();
        if(data&&data.length>0){
          var lat=parseFloat(data[0].lat);
          var lon=parseFloat(data[0].lon);

          // Icona personalizzata
          var icon=L.divIcon({
            className:"",
            html:'<div style="width:28px;height:28px;background:#c8a96e;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)"></div>',
            iconSize:[28,28],
            iconAnchor:[14,28],
            popupAnchor:[0,-28],
          });

          var marker=L.marker([lat,lon],{icon:icon}).addTo(map);
          marker.bindPopup("<strong>"+loc.name+"</strong><br>"+loc.city+(loc.address?"<br>"+loc.address:""));
          return [lat,lon];
        }
      }catch(e){
        console.log("Geocoding error:",e);
      }
      return null;
    };

    var loadMarkers=async function(){
      var coords=[];
      for(var i=0;i<locations.length;i++){
        var c=await geocodeAndPin(locations[i]);
        if(c) coords.push(c);
      }
      if(coords.length>0){
        if(coords.length===1){
          map.setView(coords[0],14);
        }else{
          map.fitBounds(coords,{padding:[30,30]});
        }
      }
    };

    // Rimuovi marker esistenti prima di aggiungerne di nuovi
    map.eachLayer(function(layer){
      if(layer instanceof L.Marker) map.removeLayer(layer);
    });

    loadMarkers();

    return function(){
      // Non distruggere la mappa al cleanup, solo i marker
    };
  },[locations]);

  // Cleanup completo solo quando il componente viene smontato
  useEffect(function(){
    return function(){
      if(mapInstanceRef.current){
        mapInstanceRef.current.remove();
        mapInstanceRef.current=null;
      }
    };
  },[]);

  return(
    <div ref={mapRef} style={{width:"100%",height:220,borderRadius:"var(--radius-lg)",overflow:"hidden",border:"1px solid var(--border)",marginBottom:"1rem",zIndex:1}}/>
  );
}

function DoveOpera({doc}){
  var _locationsState=useState([]);var locations=_locationsState[0];var setLocations=_locationsState[1];
  var _availabilityState=useState([]);var availability=_availabilityState[0];var setAvailability=_availabilityState[1];
  var _loadingState=useState(true);var loading=_loadingState[0];var setLoading=_loadingState[1];
  const DAYS=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];

  useEffect(function(){
    if(!doc||!doc.supabase_id) return;
    var load=async function(){
      var locRes=await sb.from("doctor_locations").select("*").eq("doctor_id",doc.supabase_id);
      var avRes=await sb.from("doctor_availability").select("*").eq("doctor_id",doc.supabase_id);
      if(!locRes.error) setLocations(locRes.data||[]);
      if(!avRes.error) setAvailability(avRes.data||[]);
      setLoading(false);
    };
    load();
  },[doc]);

  var globalAv=availability.filter(function(a){return !a.location_id;});
  var getLocAv=function(locId){return availability.filter(function(a){return a.location_id===locId;});};

  var AvDays=function({avList}){
    if(avList.length===0) return <p style={{fontSize:11,color:"var(--text3)"}}>Nessuna disponibilita impostata</p>;
    return <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
      {avList.map(function(a){return(
        <div key={a.id} style={{padding:"4px 9px",borderRadius:"var(--radius)",background:"var(--gold-light)",border:"1px solid rgba(200,169,110,0.25)",fontSize:10}}>
          <span style={{fontWeight:700,color:"var(--gold)"}}>{DAYS[a.day_of_week]}</span>
          <span style={{color:"var(--text2)",marginLeft:4}}>{a.time_start}-{a.time_end}</span>
        </div>
      );})}</div>;
  };

  if(loading) return <div style={{padding:"2rem",textAlign:"center"}}><p style={{fontSize:12,color:"var(--text3)"}}>Caricamento sedi...</p></div>;

  return(
    <div className="fade-in">
      {/* Mappa interattiva con tutte le sedi */}
      {locations.length>0&&<MapView locations={locations}/>}
      {/* Sedi reali */}
      {locations.length===0?(
        <div style={{padding:"1.5rem",textAlign:"center",background:"var(--bg2)",borderRadius:"var(--radius-lg)",marginBottom:"1rem"}}>
          <p style={{fontSize:28,marginBottom:8}}>📍</p>
          <p style={{fontSize:13,color:"var(--text2)"}}>Nessuna sede configurata</p>
          <p style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Il medico non ha ancora inserito le sue sedi operative</p>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:"1rem"}}>
          {locations.map(function(loc){
            var locAv=getLocAv(loc.id);
            var useGlobal=!loc.has_own_calendar;
            var displayAv=useGlobal?globalAv:locAv;
            return(
              <div key={loc.id} style={{padding:"14px 16px",background:"var(--bg2)",borderRadius:"var(--radius-lg)",border:"1px solid var(--border)"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:10}}>
                  <span style={{fontSize:20,flexShrink:0}}>🏥</span>
                  <div style={{flex:1}}>
                    <p style={{fontSize:14,fontWeight:600,color:"var(--text)",marginBottom:2}}>{loc.name}</p>
                    <p style={{fontSize:12,color:"var(--text2)",marginBottom:6}}>{"📍 "+loc.city+(loc.address?" · "+loc.address:"")}</p>
                    <div style={{marginBottom:6}}>
                      <p style={{fontSize:10,fontWeight:700,color:"var(--text3)",letterSpacing:"0.06em",marginBottom:5}}>
                        {useGlobal?"DISPONIBILITA (calendario globale)":"DISPONIBILITA SPECIFICA"}
                      </p>
                      <AvDays avList={displayAv}/>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* Calendario globale se non ci sono sedi */}
      {locations.length===0&&globalAv.length>0&&(
        <div style={{padding:"14px 16px",background:"var(--bg2)",borderRadius:"var(--radius-lg)",border:"1px solid var(--border)",marginBottom:"1rem"}}>
          <p style={{fontSize:11,fontWeight:700,color:"var(--text3)",marginBottom:8}}>DISPONIBILITA GENERALE</p>
          <AvDays avList={globalAv}/>
        </div>
      )}

      {/* Contatti */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div style={{padding:"12px 14px",background:"var(--bg2)",borderRadius:"var(--radius)",border:"1px solid var(--border)"}}>
          <p style={{fontSize:10,color:"var(--text3)",marginBottom:4}}>📞 CONTATTI</p>
          <p style={{fontSize:12,color:"var(--text)"}}>Disponibile dopo prenotazione</p>
        </div>
        <div style={{padding:"12px 14px",background:"var(--gold-light)",borderRadius:"var(--radius)",border:"1px solid rgba(200,169,110,0.2)"}}>
          <p style={{fontSize:10,color:"var(--gold)",marginBottom:4,fontWeight:700}}>✦ PRENOTA ORA</p>
          <p style={{fontSize:11,color:"var(--text2)"}}>Scegli sede e orario disponibile</p>
        </div>
      </div>
    </div>
  );
}

function BookModal({doc,onClose,user}){
  var stepState=useState(1);var step=stepState[0];var setStep=stepState[1];
  var svcState=useState("");var selService=svcState[0];var setSelService=svcState[1];
  var locState=useState(null);var selLocation=locState[0];var setSelLocation=locState[1];
  var dateState=useState("");var selDate=dateState[0];var setSelDate=dateState[1];
  var timeState=useState("");var selTime=timeState[0];var setSelTime=timeState[1];
  var locsState=useState([]);var locations=locsState[0];var setLocations=locsState[1];
  var avState=useState([]);var availability=avState[0];var setAvailability=avState[1];
  var savingState=useState(false);var saving=savingState[0];var setSaving=savingState[1];
  var errState=useState("");var err=errState[0];var setErr=errState[1];

  var DAYS=["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];

  useEffect(function(){
    if(!doc||!doc.supabase_id) return;
    var load=async function(){
      var locRes=await sb.from("doctor_locations").select("*").eq("doctor_id",doc.supabase_id);
      var avRes=await sb.from("doctor_availability").select("*").eq("doctor_id",doc.supabase_id);
      if(!locRes.error) setLocations(locRes.data||[]);
      if(!avRes.error) setAvailability(avRes.data||[]);
    };
    load();
  },[doc]);

  var getAvailableDates=function(locationId){
    var locObj=locations.find(function(l){return l.id===locationId;});
    var useGlobal=!locObj||!locObj.has_own_calendar;
    var relevantAv=availability.filter(function(a){
      if(useGlobal) return !a.location_id;
      return a.location_id===locationId;
    });
    if(relevantAv.length===0) return [];
    var activeDays=relevantAv.map(function(a){return a.day_of_week;});
    var dates=[];
    var today=new Date();
    for(var i=1;i<=28;i++){
      var d=new Date(today);
      d.setDate(today.getDate()+i);
      var dow=d.getDay();
      var adjusted=dow===0?6:dow-1;
      if(activeDays.includes(adjusted)){
        var av=relevantAv.find(function(a){return a.day_of_week===adjusted;});
        dates.push({
          label:DAYS[adjusted]+" "+d.getDate()+"/"+(d.getMonth()+1),
          dateStr:d.toISOString().split("T")[0],
          timeStart:av?av.time_start:"09:00",
          timeEnd:av?av.time_end:"18:00",
        });
      }
      if(dates.length>=6) break;
    }
    return dates;
  };

  var getTimeSlots=function(timeStart,timeEnd){
    var slots=[];
    var start=parseInt(timeStart.split(":")[0]);
    var end=parseInt(timeEnd.split(":")[0]);
    for(var h=start;h<end;h++){
      slots.push(h+":00");
      if(h<end-1) slots.push(h+":30");
    }
    return slots;
  };

  var confirmBooking=useCallback(async function(){
    if(!selService||!selDate||!selTime){setErr("Compila tutti i campi");return;}
    var patientId=user&&user.id?user.id:null;
    if(!patientId){setErr("Devi essere loggato per prenotare");return;}
    if(!doc.supabase_id){setErr("Questo medico e in modalita demo");return;}
    setSaving(true);setErr("");
    var locName=null;
    if(selLocation){
      var locObj=locations.find(function(l){return l.id===selLocation;});
      if(locObj) locName=locObj.name;
    }
    var res=await sb.from("appointments").insert({
      patient_id:patientId,
      doctor_id:doc.supabase_id,
      service:selService,
      date:selDate,
      time:selTime,
      status:"pending",
      location_id:selLocation||null,
      location_name:locName,
      notes:""
    });
    setSaving(false);
    if(res.error){setErr(res.error.message);return;}
    setStep(4);
  },[selService,selDate,selTime,selLocation,user,doc,locations]);

  var availDates=selLocation?getAvailableDates(selLocation):[];
  var selDateObj=availDates.find(function(d){return d.dateStr===selDate;});
  var timeSlots=selDateObj?getTimeSlots(selDateObj.timeStart,selDateObj.timeEnd):[];

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(26,24,20,0.65)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}} onClick={onClose}>
      <div onClick={function(e){e.stopPropagation();}} className="scale-in" style={{background:"var(--surface)",border:"1px solid var(--border2)",borderRadius:"var(--radius-lg)",padding:"1.75rem",maxWidth:460,width:"100%",maxHeight:"88vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"1.25rem",alignItems:"center"}}>
          <div style={{display:"flex",gap:10,alignItems:"center"}}><Av ini={doc.initials} sz={44} col={doc.accent}/><div><p style={{fontWeight:600,fontSize:14}}>{doc.name}</p><p style={{fontSize:11,color:"var(--text2)"}}>{doc.specialty+" · "+doc.city}</p></div></div>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,color:"var(--text3)"}}>✕</button>
        </div>
        <div style={{display:"flex",gap:4,marginBottom:"1.25rem"}}>
          {["Servizio","Sede","Data & Ora","Conferma"].map(function(s,i){
            return <div key={s} style={{flex:1,height:3,borderRadius:99,background:i<step?"var(--gold)":"var(--border)",transition:"background .3s"}}/>;
          })}
        </div>
        {step===1&&<div className="fade-in">
          <p className="label" style={{marginBottom:"0.75rem"}}>SCEGLI SERVIZIO</p>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:"1rem"}}>
            {doc.services.map(function(s){return(
              <button key={s} onClick={function(){setSelService(s);setStep(2);}}
                style={{padding:"11px 14px",borderRadius:"var(--radius)",background:selService===s?"var(--gold-light)":"var(--bg2)",border:"1px solid "+(selService===s?"var(--gold)":"var(--border)"),color:"var(--text)",fontSize:12,textAlign:"left",display:"flex",justifyContent:"space-between"}}
                onMouseEnter={function(e){e.currentTarget.style.borderColor="var(--gold)";e.currentTarget.style.background="var(--gold-light)";}}
                onMouseLeave={function(e){if(selService!==s){e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.background="var(--bg2)";}}}>{s}<span style={{color:"var(--text3)"}}>→</span></button>
            );})}
          </div>
          <div style={{background:"var(--bg2)",borderRadius:"var(--radius)",padding:"1rem",display:"flex",justifyContent:"space-between"}}>
            <div><p style={{fontSize:9,color:"var(--text3)"}}>PRIMA VISITA</p><p style={{fontSize:20,fontWeight:700,color:"var(--gold)",fontFamily:"Playfair Display,serif"}}>EUR{doc.price}</p></div>
            <div><p style={{fontSize:9,color:"var(--text3)"}}>DISPONIBILITA</p><p style={{fontSize:12,fontWeight:600,color:doc.available?"var(--teal)":"var(--coral)",marginTop:4}}>{doc.available?"Immediata":"Su richiesta"}</p></div>
          </div>
        </div>}
        {step===2&&<div className="fade-in">
          <p className="label" style={{marginBottom:"0.75rem"}}>SCEGLI SEDE</p>
          {locations.length===0?(
            <div style={{padding:"1.5rem",textAlign:"center",background:"var(--bg2)",borderRadius:"var(--radius)",marginBottom:"1rem"}}>
              <p style={{fontSize:12,color:"var(--text3)"}}>Il medico non ha ancora configurato le sue sedi.</p>
            </div>
          ):(
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:"1rem"}}>
              {locations.map(function(loc){return(
                <button key={loc.id} onClick={function(){setSelLocation(loc.id);setSelDate("");setSelTime("");setStep(3);}}
                  style={{padding:"12px 14px",borderRadius:"var(--radius)",background:selLocation===loc.id?"var(--gold-light)":"var(--bg2)",border:"1px solid "+(selLocation===loc.id?"var(--gold)":"var(--border)"),textAlign:"left",cursor:"pointer"}}
                  onMouseEnter={function(e){e.currentTarget.style.borderColor="var(--gold)";}}
                  onMouseLeave={function(e){if(selLocation!==loc.id)e.currentTarget.style.borderColor="var(--border)";}}>
                  <p style={{fontSize:13,fontWeight:600,color:"var(--text)",marginBottom:2}}>{loc.name}</p>
                  <p style={{fontSize:11,color:"var(--text2)"}}>{"📍 "+loc.city+(loc.address?" · "+loc.address:"")}</p>
                </button>
              );})}
            </div>
          )}
          <button onClick={function(){setStep(1);}} style={{fontSize:11,color:"var(--text3)",background:"none",border:"none",cursor:"pointer"}}>← indietro</button>
        </div>}
        {step===3&&<div className="fade-in">
          <p className="label" style={{marginBottom:"0.75rem"}}>SCEGLI DATA</p>
          {availDates.length===0?(
            <p style={{fontSize:12,color:"var(--text3)",marginBottom:"1rem"}}>Nessuna disponibilita nelle prossime 4 settimane.</p>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:"1rem"}}>
              {availDates.map(function(d){return(
                <button key={d.dateStr} onClick={function(){setSelDate(d.dateStr);setSelTime("");}}
                  style={{padding:"9px 4px",borderRadius:"var(--radius)",background:selDate===d.dateStr?"var(--gold-light)":"var(--bg2)",border:"1px solid "+(selDate===d.dateStr?"var(--gold)":"var(--border)"),color:selDate===d.dateStr?"var(--gold)":"var(--text)",fontSize:10,fontWeight:selDate===d.dateStr?700:400}}>
                  {d.label}
                </button>
              );})}
            </div>
          )}
          {selDate&&timeSlots.length>0&&(
            <div>
              <p className="label" style={{marginBottom:"0.75rem"}}>SCEGLI ORARIO</p>
              <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:"1rem"}}>
                {timeSlots.map(function(t){return(
                  <button key={t} onClick={function(){setSelTime(t);}}
                    style={{padding:"6px 12px",borderRadius:"var(--radius)",background:selTime===t?"var(--gold)":"var(--bg2)",border:"1px solid "+(selTime===t?"var(--gold)":"var(--border)"),color:selTime===t?"#fff":"var(--text)",fontSize:11}}>
                    {t}
                  </button>
                );})}
              </div>
            </div>
          )}
          {err&&<p style={{fontSize:11,color:"var(--coral)",marginBottom:8}}>{err}</p>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={function(){setStep(2);}} style={{flex:1,fontSize:11,color:"var(--text3)",background:"none",border:"1px solid var(--border)",borderRadius:"var(--radius)",padding:"10px"}}>← indietro</button>
            <button onClick={confirmBooking} disabled={!selDate||!selTime||saving}
              style={{flex:2,padding:"10px",borderRadius:"var(--radius)",background:(!selDate||!selTime||saving)?"var(--bg3)":"var(--gold)",border:"none",color:(!selDate||!selTime||saving)?"var(--text3)":"#fff",fontSize:12,fontWeight:700}}>
              {saving?"Salvataggio...":"Conferma prenotazione →"}
            </button>
          </div>
        </div>}
        {step===4&&<div className="fade-in" style={{textAlign:"center",padding:"1rem 0"}}>
          <div style={{fontSize:44,marginBottom:10}}>✓</div>
          <h3 className="serif" style={{fontSize:20,fontWeight:400,marginBottom:8}}>Prenotazione confermata!</h3>
          <p style={{fontSize:12,color:"var(--text2)",lineHeight:1.65,marginBottom:4}}><strong>{selService}</strong> con {doc.name}</p>
          <p style={{fontSize:12,color:"var(--gold)",marginBottom:4}}>{selDate+" alle "+selTime}</p>
          <p style={{fontSize:11,color:"var(--text3)",marginBottom:"1.25rem"}}>Il medico ricevera la tua richiesta e la confermera.</p>
          <button onClick={onClose} style={{padding:"11px 26px",borderRadius:99,background:"var(--gold)",border:"none",color:"#fff",fontSize:12,fontWeight:700}}>Perfetto!</button>
        </div>}
      </div>
    </div>
  );
}

function DocRequests({user}){

                      <span className="badge badge-gold">In attesa</span>
                    </div>
                    <p style={{fontSize:12,color:"var(--gold)",marginBottom:6,fontWeight:600}}>{r.service+" · "+r.date+" alle "+r.time}</p>
                    {r.patient&&r.patient.city&&<p style={{fontSize:11,color:"var(--text3)",marginBottom:8}}>📍 {r.patient.city}</p>}
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={function(){updateStatus(r.id,"confirmed");}} style={{padding:"8px 20px",borderRadius:"var(--radius)",background:"var(--teal-dim)",border:"1px solid rgba(45,200,137,0.25)",color:"var(--teal)",fontSize:12,fontWeight:600}}>✓ Accetta</button>

function SpecialtySelector({macroAreas,services,onChange,disabled}){
  const allMacro=Object.keys(TAXONOMY);
  const toggleMacro=area=>{
    if(disabled)return;
    const next=macroAreas.includes(area)?macroAreas.filter(x=>x!==area):[...macroAreas,area];
    const allowed=next.flatMap(a=>TAXONOMY[a].services);
    const nextSvc=services.filter(s=>allowed.includes(s));
    onChange({macroAreas:next,services:nextSvc});
  };
  const toggleSvc=svc=>{
    if(disabled)return;
    const next=services.includes(svc)?services.filter(x=>x!==svc):[...services,svc];
    onChange({macroAreas,services:next});
  };
  return(
    <div>
      <div style={{marginBottom:"1.25rem"}}>
        <label className="label" style={{marginBottom:"0.6rem"}}>STEP 1 — MACRO AREE DI SPECIALIZZAZIONE</label>
        <p style={{fontSize:11,color:"var(--text3)",marginBottom:"0.75rem",lineHeight:1.5}}>Seleziona le aree del corpo in cui sei specializzato.</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
          {allMacro.map(area=>{
            const sel=macroAreas.includes(area);
            const t=TAXONOMY[area];
            return(
              <button key={area} onClick={()=>toggleMacro(area)} disabled={disabled}
                style={{padding:"12px 8px",borderRadius:"var(--radius-lg)",border:"1.5px solid "+(sel?t.color:"var(--border)"),background:sel?(t.color+"12"):"var(--bg2)",color:sel?t.color:"var(--text3)",textAlign:"center",transition:"all .2s",cursor:disabled?"default":"pointer",opacity:disabled?0.6:1}}>
                <div style={{fontSize:18,marginBottom:5}}>{t.icon}</div>
                <p style={{fontSize:11,fontWeight:sel?700:500,lineHeight:1.3}}>{area}</p>
                <p style={{fontSize:9,color:sel?t.color:"var(--text3)",marginTop:3}}>{t.services.length} trattamenti</p>
              </button>
            );
          })}
        </div>
      </div>
      <div style={{opacity:macroAreas.length===0?0.35:1,transition:"opacity .3s",pointerEvents:macroAreas.length===0||disabled?"none":"auto"}}>
        <label className="label" style={{marginBottom:"0.5rem"}}>STEP 2 — TRATTAMENTI SPECIFICI</label>
        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {macroAreas.map(area=>{
            const t=TAXONOMY[area];
            const areaSelected=t.services.filter(s=>services.includes(s));
            return(
              <div key={area} style={{background:"var(--bg2)",borderRadius:"var(--radius-lg)",padding:"12px 14px",border:"1px solid "+(areaSelected.length>0?(t.color+"30"):"var(--border)")}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
                  <span style={{fontSize:14,color:t.color}}>{t.icon}</span>
                  <p style={{fontSize:12,fontWeight:700,color:t.color}}>{area}</p>
                  {areaSelected.length>0&&<span style={{marginLeft:"auto",fontSize:10,padding:"2px 8px",borderRadius:99,background:t.color+"18",color:t.color,border:"1px solid "+t.color+"30",fontWeight:600}}>{areaSelected.length} selezionati</span>}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {t.services.map(svc=>{
                    const sel=services.includes(svc);
                    return(
                      <button key={svc} onClick={()=>toggleSvc(svc)}
                        style={{padding:"5px 11px",borderRadius:99,border:"1px solid "+(sel?t.color:"var(--border2)"),background:sel?(t.color+"14"):"transparent",color:sel?t.color:"var(--text2)",fontSize:11,transition:"all .15s",cursor:"pointer"}}
                        onMouseEnter={e=>{if(!sel){e.currentTarget.style.borderColor=t.color;e.currentTarget.style.color=t.color;}}}
                        onMouseLeave={e=>{if(!sel){e.currentTarget.style.borderColor="var(--border2)";e.currentTarget.style.color="var(--text2)";}}}>
                        {sel?"✓ ":""}{svc}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        {services.length>0&&(
          <div style={{marginTop:12,padding:"10px 14px",background:"var(--gold-light)",borderRadius:"var(--radius)",border:"1px solid rgba(200,169,110,0.2)",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:"var(--gold)"}}>✦</span>
            <p style={{fontSize:11,color:"var(--gold)",fontWeight:600}}>{services.length} trattamenti selezionati</p>
          </div>
        )}
      </div>
    </div>
  );
}

function DocSedi({user}){
  var _locationsState=useState([]);var locations=_locationsState[0];var setLocations=_locationsState[1];
  var _availabilityState=useState([]);var availability=_availabilityState[0];var setAvailability=_availabilityState[1];
  var _loadingState=useState(true);var loading=_loadingState[0];var setLoading=_loadingState[1];
  var _showAddLocState=useState(false);var showAddLoc=_showAddLocState[0];var setShowAddLoc=_showAddLocState[1];
  var _newLocState=useState({name:"",address:"",city:"",has_own_calendar:false});var newLoc=_newLocState[0];var setNewLoc=_newLocState[1];
  var _savingState=useState(false);var saving=_savingState[0];var setSaving=_savingState[1];
  var _activeLocState=useState(null);var activeLoc=_activeLocState[0];var setActiveLoc=_activeLocState[1]; // sede selezionata per il calendario
  const DAYS=["Lunedi","Martedi","Mercoledi","Giovedi","Venerdi","Sabato","Domenica"];
  const TIMES=["08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];

  var load=useCallback(async function(){
    if(!user||!user.id) return;
    setLoading(true);
    var locRes=await sb.from("doctor_locations").select("*").eq("doctor_id",user.id).order("created_at");
    var avRes=await sb.from("doctor_availability").select("*").eq("doctor_id",user.id);
    if(!locRes.error) setLocations(locRes.data||[]);
    if(!avRes.error) setAvailability(avRes.data||[]);
    setLoading(false);
  },[user]);

  useEffect(function(){load();},[load]);

  var addLocation=useCallback(async function(){
    if(!newLoc.name||!newLoc.city){return;}
    setSaving(true);
    var res=await sb.from("doctor_locations").insert({
      doctor_id:user.id,
      name:newLoc.name,
      address:newLoc.address,
      city:newLoc.city,
      has_own_calendar:newLoc.has_own_calendar
    });
    if(!res.error){
      setNewLoc({name:"",address:"",city:"",has_own_calendar:false});
      setShowAddLoc(false);
      await load();
    }
    setSaving(false);
  },[newLoc,user,load]);

  var removeLocation=async function(id){
    await sb.from("doctor_locations").delete().eq("id",id);
    setLocations(function(prev){return prev.filter(function(l){return l.id!==id;});});
  };

  var toggleDay=async function(locationId,dayIndex,currentlyActive){
    if(currentlyActive){
      // Rimuovi slot per questo giorno
      await sb.from("doctor_availability")
        .delete()
        .eq("doctor_id",user.id)
        .eq("day_of_week",dayIndex)
        .eq("location_id",locationId||null);
      setAvailability(function(prev){
        return prev.filter(function(a){
          return !(a.day_of_week===dayIndex&&a.location_id===locationId);
        });
      });
    }else{
      // Aggiungi slot default 9-18
      var res=await sb.from("doctor_availability").insert({
        doctor_id:user.id,
        location_id:locationId||null,
        day_of_week:dayIndex,
        time_start:"09:00",
        time_end:"18:00"
      });
      if(!res.error) await load();
    }
  };

  var updateTime=async function(avId,field,value){
    await sb.from("doctor_availability").update({[field]:value}).eq("id",avId);
    setAvailability(function(prev){
      return prev.map(function(a){
        if(a.id!==avId) return a;
        var n=Object.assign({},a);
        n[field]=value;
        return n;
      });
    });
  };

  var getAvForLoc=function(locationId){
    return availability.filter(function(a){return a.location_id===locationId;});
  };

  var globalAv=availability.filter(function(a){return !a.location_id;});

  if(loading) return <div className="fade-in" style={{textAlign:"center",padding:"3rem"}}><p style={{color:"var(--text3)",fontSize:12}}>Caricamento sedi...</p></div>;

  return(
    <div className="fade-in">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"1.5rem"}}>
        <SecTitle title="Sedi e Disponibilita" sub="Gestisci dove operi e quando sei disponibile"/>
        <button onClick={function(){setShowAddLoc(true);}} style={{padding:"8px 18px",borderRadius:"var(--radius)",background:"var(--gold)",border:"none",color:"#fff",fontSize:12,fontWeight:700}}>+ Aggiungi sede</button>
      </div>

      {/* Modale aggiungi sede */}
      {showAddLoc&&(
        <Card style={{marginBottom:"1.5rem",border:"1px solid var(--gold)",background:"var(--gold-light)"}}>
          <p style={{fontSize:12,fontWeight:700,color:"var(--gold)",marginBottom:"1rem"}}>✦ Nuova sede</p>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label className="label">NOME STUDIO *</label><input value={newLoc.name} onChange={function(e){setNewLoc(function(p){return Object.assign({},p,{name:e.target.value});});}} placeholder="Es. Studio Milano Centro" className="inp"/></div>
            <div><label className="label">CITTA *</label><input value={newLoc.city} onChange={function(e){setNewLoc(function(p){return Object.assign({},p,{city:e.target.value});});}} placeholder="Es. Milano" className="inp"/></div>
            <div style={{gridColumn:"1/-1"}}><label className="label">INDIRIZZO</label><input value={newLoc.address} onChange={function(e){setNewLoc(function(p){return Object.assign({},p,{address:e.target.value});});}} placeholder="Via e numero civico" className="inp"/></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem",padding:"10px 14px",background:"var(--surface)",borderRadius:"var(--radius)",border:"1px solid var(--border)"}}>
            <button onClick={function(){setNewLoc(function(p){return Object.assign({},p,{has_own_calendar:!p.has_own_calendar});});}}
              style={{width:42,height:22,borderRadius:99,background:newLoc.has_own_calendar?"var(--gold)":"var(--bg3)",border:"none",position:"relative",cursor:"pointer",flexShrink:0}}>
              <div style={{position:"absolute",top:3,left:newLoc.has_own_calendar?20:3,width:16,height:16,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,0.3)"}}/>
            </button>
            <div>
              <p style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>Calendario specifico per questa sede</p>
              <p style={{fontSize:10,color:"var(--text3)"}}>{newLoc.has_own_calendar?"Imposterai i giorni disponibili solo per questa sede":"Userai il calendario globale per tutte le sedi"}</p>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={function(){setShowAddLoc(false);}} style={{flex:1,padding:"9px",borderRadius:"var(--radius)",background:"transparent",border:"1px solid var(--border)",color:"var(--text2)",fontSize:12}}>Annulla</button>
            <button onClick={addLocation} disabled={saving} style={{flex:2,padding:"9px",borderRadius:"var(--radius)",background:saving?"var(--bg3)":"var(--gold)",border:"none",color:saving?"var(--text3)":"#fff",fontSize:12,fontWeight:700}}>{saving?"Salvataggio...":"Salva sede"}</button>
          </div>
        </Card>
      )}

      {/* Calendario globale */}
      <Card style={{marginBottom:"1.5rem"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:"1rem"}}>
          <div style={{width:36,height:36,borderRadius:"50%",background:"var(--gold-light)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🌍</div>
          <div style={{flex:1}}>
            <p style={{fontSize:13,fontWeight:700,color:"var(--text)"}}>Calendario globale</p>
            <p style={{fontSize:10,color:"var(--text3)"}}>Valido per tutte le sedi senza calendario specifico</p>
          </div>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {DAYS.map(function(day,idx){
            var av=globalAv.find(function(a){return a.day_of_week===idx;});
            var active=!!av;
            return(
              <div key={day} style={{display:"flex",flexDirection:"column",gap:4,alignItems:"center"}}>
                <button onClick={function(){toggleDay(null,idx,active);}}
                  style={{padding:"6px 12px",borderRadius:"var(--radius)",border:"1px solid "+(active?"var(--gold)":"var(--border)"),background:active?"var(--gold-light)":"var(--surface)",color:active?"var(--gold)":"var(--text3)",fontSize:11,fontWeight:active?700:400,cursor:"pointer"}}>
                  {day.slice(0,3)}
                </button>
                {active&&av&&(
                  <div style={{display:"flex",gap:3,alignItems:"center"}}>
                    <select value={av.time_start} onChange={function(e){updateTime(av.id,"time_start",e.target.value);}}
                      style={{fontSize:9,padding:"2px 4px",borderRadius:4,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text2)"}}>
                      {TIMES.map(function(t){return <option key={t}>{t}</option>;})}
                    </select>
                    <span style={{fontSize:9,color:"var(--text3)"}}>-</span>
                    <select value={av.time_end} onChange={function(e){updateTime(av.id,"time_end",e.target.value);}}
                      style={{fontSize:9,padding:"2px 4px",borderRadius:4,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text2)"}}>
                      {TIMES.map(function(t){return <option key={t}>{t}</option>;})}
                    </select>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </Card>

      {/* Lista sedi */}
      {locations.length===0?(
        <Card style={{textAlign:"center",padding:"2.5rem"}}>
          <p style={{fontSize:24,marginBottom:8}}>📍</p>
          <p style={{color:"var(--text2)",marginBottom:4}}>Nessuna sede aggiunta</p>
          <p style={{fontSize:11,color:"var(--text3)"}}>Aggiungi le tue sedi operative per apparire nelle ricerche locali</p>
        </Card>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {locations.map(function(loc){
            var locAv=getAvForLoc(loc.id);
            var isExpanded=activeLoc===loc.id;
            return(
              <Card key={loc.id}>
                <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:40,height:40,borderRadius:"var(--radius)",background:"var(--bg2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>📍</div>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <p style={{fontSize:14,fontWeight:700,color:"var(--text)"}}>{loc.name}</p>
                      <div style={{display:"flex",gap:6}}>
                        <span className={"badge "+(loc.has_own_calendar?"badge-gold":"badge-gray")}>{loc.has_own_calendar?"Calendario proprio":"Calendario globale"}</span>
                        <button onClick={function(){removeLocation(loc.id);}} style={{background:"none",border:"none",color:"var(--text3)",cursor:"pointer",fontSize:14}}>✕</button>
                      </div>
                    </div>
                    <p style={{fontSize:12,color:"var(--text2)",marginBottom:8}}>📍 {loc.city}{loc.address?" · "+loc.address:""}</p>
                    <MapView locations={[loc]}/>
                    {loc.has_own_calendar&&(
                      <div>
                        <button onClick={function(){setActiveLoc(isExpanded?null:loc.id);}}
                          style={{fontSize:11,color:"var(--gold)",background:"none",border:"none",cursor:"pointer",marginBottom:isExpanded?10:0,fontWeight:600}}>
                          {isExpanded?"▲ Nascondi calendario":"▼ Gestisci disponibilita per questa sede"}
                        </button>
                        {isExpanded&&(
                          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                            {DAYS.map(function(day,idx){
                              var av=locAv.find(function(a){return a.day_of_week===idx;});
                              var active=!!av;
                              return(
                                <div key={day} style={{display:"flex",flexDirection:"column",gap:4,alignItems:"center"}}>
                                  <button onClick={function(){toggleDay(loc.id,idx,active);}}
                                    style={{padding:"6px 12px",borderRadius:"var(--radius)",border:"1px solid "+(active?"var(--gold)":"var(--border)"),background:active?"var(--gold-light)":"var(--surface)",color:active?"var(--gold)":"var(--text3)",fontSize:11,fontWeight:active?700:400,cursor:"pointer"}}>
                                    {day.slice(0,3)}
                                  </button>
                                  {active&&av&&(
                                    <div style={{display:"flex",gap:3,alignItems:"center"}}>
                                      <select value={av.time_start} onChange={function(e){updateTime(av.id,"time_start",e.target.value);}}
                                        style={{fontSize:9,padding:"2px 4px",borderRadius:4,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text2)"}}>
                                        {TIMES.map(function(t){return <option key={t}>{t}</option>;})}
                                      </select>
                                      <span style={{fontSize:9,color:"var(--text3)"}}>-</span>
                                      <select value={av.time_end} onChange={function(e){updateTime(av.id,"time_end",e.target.value);}}
                                        style={{fontSize:9,padding:"2px 4px",borderRadius:4,border:"1px solid var(--border)",background:"var(--surface)",color:"var(--text2)"}}>
                                        {TIMES.map(function(t){return <option key={t}>{t}</option>;})}
                                      </select>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function DocAnalytics(){
  const months=["Gen","Feb","Mar","Apr","Mag"];
  const vis=[18,22,26,31,38];const rev=[2700,3300,3900,4650,5700];
  const mV=Math.max(...vis);const mR=Math.max(...rev);
  return(
    <div className="fade-in">
      <SecTitle title="Statistiche" sub="Andamento del tuo studio su GlowUp"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
        {[[vis,mV,"VISITE MENSILI","var(--gold)","var(--gold-dim)",function(v){return v;},"+23% rispetto al mese scorso"],[rev,mR,"FATTURATO (€)","var(--teal)","rgba(45,200,137,0.4)",function(v){return (v/1000).toFixed(1)+"k";},"+22% rispetto al mese scorso"]].map(function(arr,ki){
          var data=arr[0],max=arr[1],title=arr[2],c1=arr[3],c2=arr[4],fmt=arr[5],trend=arr[6];
          return(
            <Card key={ki}>
              <p style={{fontSize:10,fontWeight:700,letterSpacing:"0.08em",color:"var(--text3)",marginBottom:"1rem"}}>{title}</p>
              <div style={{display:"flex",gap:10,alignItems:"flex-end",height:100,marginBottom:8}}>
                {months.map(function(m,i){return(
                  <div key={m} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
                    <span style={{fontSize:10,color:c1,fontWeight:600}}>{fmt(data[i])}</span>
                    <div style={{width:"100%",background:"linear-gradient(to top,"+c1+","+c2+")",borderRadius:"4px 4px 0 0",height:((data[i]/max)*80)+"px",transition:"height .5s",opacity:i===months.length-1?1:0.6}}/>
                    <span style={{fontSize:9,color:"var(--text3)"}}>{m}</span>
                  </div>
                );})}
              </div>
              <p style={{fontSize:11,color:"var(--teal)"}}>↑ {trend}</p>
            </Card>
          );
        })}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
        {[{v:"68%",l:"Tasso conversione",s:"visite → prenotazioni",c:"var(--gold)"},{v:"4.9★",l:"Valutazione media",s:"da 128 recensioni",c:"var(--gold)"},{v:"12",l:"Nuovi pazienti",s:"questo mese",c:"var(--teal)"}].map(s=>(
          <div key={s.l} className="stat-card" style={{textAlign:"center"}}><p style={{fontSize:28,fontWeight:700,color:s.c,fontFamily:"Playfair Display,serif",marginBottom:4}}>{s.v}</p><p style={{fontSize:12,color:"var(--text)",marginBottom:2}}>{s.l}</p><p style={{fontSize:10,color:"var(--text3)"}}>{s.s}</p></div>
        ))}
      </div>
    </div>
  );
}

function PatAppointments({user}){
  var _apptsState=useState([]);var appts=_apptsState[0];var setAppts=_apptsState[1];
  var _loadingState=useState(true);var loading=_loadingState[0];var setLoading=_loadingState[1];

  useEffect(function(){
    if(!user||!user.id) return;
    var fetch=async function(){
      setLoading(true);
      var res=await sb.from("appointments")
        .select("*")
        .eq("patient_id",user.id)
        .order("created_at",{ascending:false});
      if(!res.error&&res.data) setAppts(res.data);
      setLoading(false);
    };
    fetch();
  },[user]);

  var cancelAppt=async function(id){
    await sb.from("appointments").update({status:"cancelled"}).eq("id",id);
    setAppts(function(prev){return prev.map(function(a){return a.id===id?Object.assign({},a,{status:"cancelled"}):a;});});
  };

  // Cerca il nome del medico dall'array DOCTORS tramite supabase_id
  var getDoctorName=function(doctorId){
    var found=DOCTORS.find(function(d){return d.supabase_id===doctorId;});
    return found?found.name:"Medico";
  };
  var getDoctorInitials=function(doctorId){
    var found=DOCTORS.find(function(d){return d.supabase_id===doctorId;});
    return found?found.initials:"MD";
  };
  var getDoctorColor=function(doctorId){
    var found=DOCTORS.find(function(d){return d.supabase_id===doctorId;});
    return found?found.accent:"#c8a96e";
  };

  var upcoming=appts.filter(function(a){return a.status!=="cancelled";});
  var cancelled=appts.filter(function(a){return a.status==="cancelled";});

  if(loading) return <div className="fade-in" style={{textAlign:"center",padding:"3rem"}}><p style={{color:"var(--text3)",fontSize:12}}>Caricamento appuntamenti...</p></div>;

  return(
    <div className="fade-in">
      <SecTitle title="Appuntamenti" sub="I tuoi appuntamenti"/>
      {appts.length===0&&(
        <Card style={{textAlign:"center",padding:"3rem"}}>
          <p style={{fontSize:28,marginBottom:10}}>📅</p>
          <p style={{color:"var(--text2)",marginBottom:6}}>Nessun appuntamento ancora</p>
          <p style={{fontSize:11,color:"var(--text3)"}}>Prenota una visita dal marketplace</p>
        </Card>
      )}
      {upcoming.length>0&&(
        <div style={{marginBottom:20}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.08em",color:"var(--text3)",marginBottom:"0.75rem"}}>PRENOTAZIONI</p>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {upcoming.map(function(a){
              var docName=getDoctorName(a.doctor_id);
              var docIni=getDoctorInitials(a.doctor_id);
              var docCol=getDoctorColor(a.doctor_id);
              return(
                <Card key={a.id} style={{display:"flex",gap:14,alignItems:"center"}}>
                  <Av ini={docIni} sz={46} col={docCol}/>
                  <div style={{flex:1}}>
                    <p style={{fontSize:14,fontWeight:600,marginBottom:2}}>{docName}</p>
                    <p style={{fontSize:12,color:"var(--gold)",fontWeight:600,marginBottom:2}}>{a.service}</p>
                    <p style={{fontSize:11,color:"var(--text2)"}}>📅 {a.date+" alle "+a.time}</p>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <span className={"badge "+(a.status==="confirmed"?"badge-green":"badge-gold")}>{a.status==="confirmed"?"✓ Confermato":"In attesa"}</span>
                    <button onClick={function(){cancelAppt(a.id);}} style={{padding:"6px 14px",borderRadius:"var(--radius)",background:"transparent",border:"1px solid var(--coral-dim)",color:"var(--coral)",fontSize:11}} onMouseEnter={function(e){e.currentTarget.style.background="var(--coral-dim)";}} onMouseLeave={function(e){e.currentTarget.style.background="transparent";}}>Cancella</button>
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
      )}
      {cancelled.length>0&&(
        <div>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:"0.08em",color:"var(--text3)",marginBottom:"0.75rem"}}>CANCELLATI</p>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {cancelled.map(function(a){
              var docName=getDoctorName(a.doctor_id);
              var docIni=getDoctorInitials(a.doctor_id);
              return(
                <Card key={a.id} style={{display:"flex",gap:14,alignItems:"center",opacity:0.5}}>
                  <Av ini={docIni} sz={46} col="#8c8880"/>
                  <div style={{flex:1}}>
                    <p style={{fontSize:14,fontWeight:600,marginBottom:2}}>{docName}</p>
                    <p style={{fontSize:12,color:"var(--text2)",marginBottom:2}}>{a.service}</p>
                    <p style={{fontSize:11,color:"var(--text3)"}}>📅 {a.date}</p>
                  </div>
                  <span className="badge badge-gray">Cancellato</span>
                </Card>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function App(){
  var _pageState=useState("home");var page=_pageState[0];var setPage=_pageState[1];
  var _userState=useState(null);var user=_userState[0];var setUser=_userState[1];
  var _uiState=useState({heroTitle:null,heroSubtitle:null,highlightedDoctorIds:[],filterTags:[],filterCity:null,contextNote:null,suggestions:[]});var ui=_uiState[0];var setUi=_uiState[1];
  var _bookDocState=useState(null);var bookDoc=_bookDocState[0];var setBookDoc=_bookDocState[1];
  var _viewDocState=useState(null);var viewDoc=_viewDocState[0];var setViewDoc=_viewDocState[1];
  var _authCheckedState=useState(false);var authChecked=_authCheckedState[0];var setAuthChecked=_authCheckedState[1];
  const updUi=useCallback(function(u){setUi(function(p){var n={};Object.keys(p).forEach(function(k){n[k]=p[k];});Object.keys(u).forEach(function(k){n[k]=u[k];});return n;});},[]);

  // Controlla sessione esistente al caricamento
  useEffect(function(){
    sb.auth.getSession().then(async function(res){
      if(res.data.session){
        var uid=res.data.session.user.id;
        var prof=await sb.from("profiles").select("*").eq("id",uid).single();
        if(prof.data){
          var p=prof.data;
          var ini=p.name.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase();
          setUser({name:p.name,initials:ini,type:p.type,id:uid});
          setPage("dashboard");
        }
      }
      setAuthChecked(true);
    });
  },[]);

  var login=function(u){setUser(u);setPage("dashboard");};
  var logout=async function(){await sb.auth.signOut();setUser(null);setPage("home");};
  window._logout=logout;

  if(!authChecked) return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"var(--bg)"}}><div style={{textAlign:"center"}}><div style={{fontSize:28,marginBottom:12}}>✦</div><p style={{color:"var(--text3)",fontSize:12}}>Caricamento...</p></div></div>;

  if(!user&&["home","info","fordoctors"].includes(page)){
    return <div className="layout">
      <Header user={null} onLogout={logout} nav={setPage} cur={page}/>
      <main className="layout-main"><Marketplace uiState={ui} onBook={setBookDoc} onView={setViewDoc}/></main>
      <aside className="layout-chat"><Gloria onUpdate={updUi} ctx="marketplace" doctors={[]} /></aside>
      {viewDoc&&<DoctorProfileModal doc={viewDoc} onClose={()=>setViewDoc(null)} onBook={d=>{setViewDoc(null);setBookDoc(d);}}/>}
      {bookDoc&&<BookModal doc={bookDoc} onClose={()=>setBookDoc(null)} user={user}/>}
    </div>;
  }
  if(page==="login") return <div style={{display:"flex",flexDirection:"column",height:"100vh"}}><Header user={null} onLogout={logout} nav={setPage} cur="login"/><LoginPage onLogin={login} nav={setPage}/></div>;
  if(page==="register") return <div style={{display:"flex",flexDirection:"column",height:"100vh"}}><Header user={null} onLogout={logout} nav={setPage} cur="register"/><RegisterPage onLogin={login} nav={setPage}/></div>;
  if(user&&page==="dashboard") return user.type==="doctor"?<DocDashboard user={user}/>:<PatDashboard user={user} nav={setPage} uiState={ui} onUiUpdate={updUi} bookDoc={bookDoc} setBookDoc={setBookDoc} viewDoc={viewDoc} setViewDoc={setViewDoc}/>;
  return null;
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
